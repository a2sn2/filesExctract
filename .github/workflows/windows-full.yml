name: Windows Full Product

on:
  push:
    branches: ["release/windows-full-v0.4", "feat/layout-preserving-conversion", "main"]
  workflow_dispatch:

concurrency:
  group: windows-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build self-contained Windows product
        shell: pwsh
        run: ./packaging/windows_full/build_full.ps1

      - name: Smoke test portable full product
        shell: pwsh
        run: python packaging/windows_full/smoke_full.py release/windows-full

      - name: Build integrity manifest
        shell: pwsh
        run: ./packaging/windows_full/package_full.ps1 -Phase Manifest

      - name: Build portable ZIP
        shell: pwsh
        run: ./packaging/windows_full/package_full.ps1 -Phase Portable

      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows_full/package_full.ps1 -Phase Installer

      - name: Finalize Windows package checksums
        shell: pwsh
        run: ./packaging/windows_full/package_full.ps1 -Phase Finalize

      - name: Silent-install final installer
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "FilesExtractInstalled"
          $process = Start-Process -FilePath "dist/FilesExtract-Full-Setup-v0.5.0.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Installer returned exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $install "FilesExtract.exe"))) { throw "Installer did not create FilesExtract.exe" }
          "FILES_EXTRACT_INSTALLED=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test installed product
        shell: pwsh
        run: python packaging/windows_full/smoke_full.py "$env:FILES_EXTRACT_INSTALLED"

      - name: Long-path installer regression test
        shell: pwsh
        run: |
          $segmentA = "FilesExtract-LongPathRegression-012345678901234567890123456789"
          $segmentB = "NestedProfile-012345678901234567890123456789"
          $install = Join-Path $env:RUNNER_TEMP "$segmentA\$segmentB\FilesExtract"
          New-Item -ItemType Directory -Force -Path (Split-Path $install -Parent) | Out-Null
          $process = Start-Process -FilePath "dist/FilesExtract-Full-Setup-v0.5.0.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Long-path install returned exit code $($process.ExitCode)" }
          $exe = Join-Path $install "FilesExtract.exe"
          if (-not (Test-Path $exe)) { throw "Long-path installer did not create FilesExtract.exe" }
          $deepFiles = Get-ChildItem $install -File -Recurse | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 5
          $deepFiles | ForEach-Object { Write-Host "Installed path length $($_.FullName.Length): $($_.FullName)" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable failed under the long path." }

      - name: Upload Windows full product
        uses: actions/upload-artifact@v4
        with:
          name: FilesExtract-Full-v0.5.0-windows-x64
          path: |
            dist/FilesExtract-Full-Setup-v0.5.0.exe
            dist/FilesExtract-Full-Portable-v0.5.0-windows-x64.zip
            dist/SHA256SUMS-WINDOWS-FULL.txt
            dist/build-info-windows-full.json
          if-no-files-found: error
          retention-days: 30
